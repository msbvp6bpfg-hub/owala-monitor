name: Owala Auto Checker

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    env:
      ACTIONS_NODE20_FORCE_DISABLE_DEPRECATION_WARNING: 'true'
    steps:
      - name: 下載代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          pip install -r requirements.txt

      - name: 執行庫存檢查
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python monitor.py

      - name: 儲存並更新庫存狀態
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stock state [skip ci]"
          file_pattern: "stock_state.json"

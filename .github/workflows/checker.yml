name: Owala Auto Checker

on:
  schedule:
    - cron: '*/10 * * * *'  # 每 10 分鐘自動在雲端檢查一次
  workflow_dispatch:        # 允許你在網頁上手動點擊立即執行

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: 下載代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          pip install -r requirements.txt

      - name: 執行庫存檢查
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python monitor.py
